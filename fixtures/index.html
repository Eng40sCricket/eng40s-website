<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>England Over 40s Cricket - Fixtures</title>
    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="hero-section">
            <div class="container">
                <h1>2026 Season Fixtures</h1>
                <p>Follow the England Over 40s as they prepare for the IMC World Cup in Guyana.</p>
            </div>
        </section>

        <section class="section section-light">
            <div class="container">
                <h2 class="section-title">Next Match</h2>
                <div id="next-match-highlight" class="next-match-highlight-container">
                    <!-- Next match will be dynamically loaded here -->
                    <div class="text-center">Loading next match...</div>
                </div>

                <h2 class="section-title">Upcoming Fixtures</h2>
                <div id="fixture-list-container" class="match-list">
                    <!-- Upcoming fixtures will be dynamically loaded here -->
                    <div class="text-center">Loading upcoming fixtures...</div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="./assets/js/main.js"></script>
</body>
</html>
